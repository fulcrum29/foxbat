# Aplikacja potrzebuje wyłącznie odczytu listy przestrzeni nazw i obiektów,
# dla których wylicza rekomendacje. Nie ma uprawnień do zmiany zasobów klastra.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foxbat-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foxbat-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: foxbat-read
subjects:
  - kind: ServiceAccount
    name: foxbat
    namespace: {{ .Release.Namespace }}
