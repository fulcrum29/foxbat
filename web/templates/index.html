<!DOCTYPE html>
<html lang="en" class="uk-theme-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxbat - Kubernetes Resource Recommender</title>
    <link rel="stylesheet" href="https://unpkg.com/franken-ui@1.1.0/dist/css/core.min.css" />
    <script src="https://unpkg.com/franken-ui@1.1.0/dist/js/core.min.js" type="module"></script>
    <script src="https://unpkg.com/franken-ui@1.1.0/dist/js/icon.min.js" type="module"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="uk-background-muted uk-padding">
    <div class="uk-container uk-container-small">
        <header class="uk-margin-large-bottom">
            <h1 class="uk-heading-small">Foxbat</h1>
            <p class="uk-text-lead uk-text-muted">Kubernetes Resource Recommendation Service</p>
        </header>

        <section class="uk-card uk-card-default uk-card-body uk-border-rounded">
            <h2 class="uk-card-title">Get Recommendations</h2>
            <form hx-get="/ui/recommendations" hx-target="#results" hx-indicator="#loading" class="uk-grid-small" uk-grid>
                <div class="uk-width-1-2@s">
                    <label class="uk-form-label" for="namespace">Namespace</label>
                    <select class="uk-select" id="namespace" name="namespace"
                            hx-get="/ui/workloads"
                            hx-target="#workload-container"
                            hx-indicator="#loading">
                        <option value="">Select Namespace</option>
                        {{range .Namespaces}}
                        <option value="{{.}}">{{.}}</option>
                        {{end}}
                    </select>
                </div>
                <div id="workload-container" class="uk-width-1-2@s">
                    <label class="uk-form-label" for="workload">Workload (Deployment/SS/DS)</label>
                    <select class="uk-select" id="workload" name="workload" disabled>
                        <option value="">Select Workload</option>
                    </select>
                </div>
                <div class="uk-width-1-2@s">
                    <label class="uk-form-label" for="window">Time range</label>
                    <select class="uk-select" id="window" name="window">
                        {{range .Windows}}
                        <option value="{{.}}" {{if eq . $.DefaultWindow}}selected{{end}}>Last {{.}}</option>
                        {{end}}
                    </select>
                </div>
                <div class="uk-width-1-1">
                    <button type="submit" class="uk-button uk-button-primary uk-border-rounded">Query Recommendations</button>
                </div>
            </form>
        </section>

        <div id="loading" class="htmx-indicator uk-margin-top uk-text-center">
            <div uk-spinner></div>
            <span class="uk-margin-small-left">Fetching metrics from Prometheus...</span>
        </div>

        <section id="results" class="uk-margin-large-top">
            <!-- Recommendations will be loaded here -->
            <div class="uk-text-center uk-text-muted">
                <p>Fill out the form above to see recommendations.</p>
            </div>
        </section>
    </div>
</body>
</html>
